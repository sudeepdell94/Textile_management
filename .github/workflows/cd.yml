name: CD - Deploy to EC2

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Test EC2 network connectivity
        run: |
            echo "GitHub runner public IP:"
            curl -s https://checkip.amazonaws.com
            echo

            echo "Testing EC2 port 22..."

            nc -zv -w 10 "${{ secrets.EC2_HOST }}" 22

            echo "EC2 port 22 is reachable"


      - name: Deploy application to EC2
        run: |
          ssh -i ~/.ssh/textile.pem \
            ubuntu@${{ secrets.EC2_HOST }} << 'EOF'

          set -e

          echo "======================================"
          echo "Starting Textile deployment"
          echo "======================================"

          cd /opt/textile

          echo "Logging into Amazon ECR..."

          aws ecr get-login-password \
            --region ap-south-1 | \
          docker login \
            --username AWS \
            --password-stdin \
            177203142319.dkr.ecr.ap-south-1.amazonaws.com

          echo "Pulling latest Docker images..."

          docker compose pull

          echo "Recreating application containers..."

          docker compose up -d

          echo "Checking deployment status..."

          docker compose ps

          echo "======================================"
          echo "Deployment completed successfully"
          echo "======================================"

          EOF
