name: CD - Deploy to EC2

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:

      - name: Set deployment version
        run: |
          IMAGE_TAG="${GITHUB_EVENT_WORKFLOW_RUN_HEAD_SHA:0:7}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Deployment version: $IMAGE_TAG"
          echo "======================================"
        env:
          GITHUB_EVENT_WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/textile.pem

          chmod 600 ~/.ssh/textile.pem

          echo "Testing EC2 connectivity..."

          nc -zv -w 10 "${{ secrets.EC2_HOST }}" 22

          echo "EC2 port 22 is reachable"

          ssh-keyscan -T 10 -H "${{ secrets.EC2_HOST }}" \
            >> ~/.ssh/known_hosts

          echo "SSH host key collected successfully"

          echo "Checking private key..."

          test -f ~/.ssh/textile.pem

          echo "Private key exists"

      - name: Deploy application to EC2
        run: |
          ssh -i ~/.ssh/textile.pem \
            ubuntu@${{ secrets.EC2_HOST }} \
            "IMAGE_TAG='$IMAGE_TAG' bash -s" << 'EOF'

          set -euo pipefail

          echo "======================================"
          echo "Starting Textile deployment"
          echo "Deployment SHA: $IMAGE_TAG"
          echo "======================================"

          cd /opt/textile

          echo "Reading deployment history..."

          HISTORY_FILE="/opt/textile/deployment-history.log"

          if [ ! -f "$HISTORY_FILE" ]; then
            echo "Deployment history file not found"
            exit 1
          fi

          ROLLBACK_SHA=$(grep '|SUCCESS$' "$HISTORY_FILE" | tail -n 1 | cut -d'|' -f2)

          if [ -z "$ROLLBACK_SHA" ]; then
            echo "No previous successful deployment found"
            exit 1
          fi

          echo "Previous successful SHA: $ROLLBACK_SHA"

          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)|$IMAGE_TAG|STARTED" \
            >> "$HISTORY_FILE"

          echo "Deployment recorded as STARTED"

          echo "Logging into Amazon ECR..."

          aws ecr get-login-password \
            --region ap-south-1 | \
          docker login \
            --username AWS \
            --password-stdin \
            177203142319.dkr.ecr.ap-south-1.amazonaws.com

          echo "Pulling Docker images for SHA: $IMAGE_TAG"

          IMAGE_TAG="$IMAGE_TAG" docker compose pull

          echo "Recreating application containers..."

          IMAGE_TAG="$IMAGE_TAG" docker compose up -d --force-recreate

          echo "Restarting Nginx to refresh upstreams..."

          docker restart textile-nginx

          echo "Checking container status..."

          IMAGE_TAG="$IMAGE_TAG" docker compose ps

          echo "======================================"
          echo "Running application health checks"
          echo "Deployment SHA: $IMAGE_TAG"
          echo "======================================"

          echo "Checking frontend..."

          attempt=1
          max_attempts=6

          while [ "$attempt" -le "$max_attempts" ]; do
            if curl -fsS http://localhost/ > /dev/null; then
              echo "Frontend health check: PASS"
              break
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Frontend health check: FAILED"
              exit 1
            fi

            echo "Frontend not ready. Retrying in 5 seconds..."
            sleep 5
            attempt=$((attempt + 1))
          done

          echo "Checking backend..."

          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            if curl -fsS http://localhost/api/health > /dev/null; then
              echo "Backend health check: PASS"
              break
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Backend health check: FAILED"
              exit 1
            fi

            echo "Backend not ready. Retrying in 5 seconds..."
            sleep 5
            attempt=$((attempt + 1))
          done

          echo "======================================"
          echo "All health checks passed"
          echo "Deployment successful"
          echo "SHA: $IMAGE_TAG"
          echo "======================================"

          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)|$IMAGE_TAG|SUCCESS" \
            >> "$HISTORY_FILE"

          echo "Deployment recorded as SUCCESS"

          EOF