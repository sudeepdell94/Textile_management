name: CD - Deploy to EC2

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed

# Prevent two production deployments from running at the same time.
# If B is deploying, C waits for B to finish....
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    # CD runs only when the CI workflow completed successfully.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:

      # ============================================================
      # STEP 1: Determine the Docker image tag
      # ============================================================

      - name: Set deployment version
        run: |
          IMAGE_TAG="${GITHUB_EVENT_WORKFLOW_RUN_HEAD_SHA:0:7}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Deployment version: $IMAGE_TAG"
          echo "======================================"

        env:
          GITHUB_EVENT_WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}


      # ============================================================
      # STEP 2: Configure SSH
      # ============================================================

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/textile.pem

          chmod 600 ~/.ssh/textile.pem

          echo "Testing EC2 connectivity..."

          nc -zv -w 10 "${{ secrets.EC2_HOST }}" 22

          echo "EC2 port 22 is reachable"

          ssh-keyscan -T 10 -H "${{ secrets.EC2_HOST }}" \
            >> ~/.ssh/known_hosts

          echo "SSH host key collected successfully"

          echo "Checking private key..."

          test -f ~/.ssh/textile.pem

          echo "Private key exists"


      # ============================================================
      # STEP 3: Deploy application
      # ============================================================

      - name: Deploy application to EC2
        run: |
          ssh -i ~/.ssh/textile.pem \
            ubuntu@${{ secrets.EC2_HOST }} \
            "IMAGE_TAG='$IMAGE_TAG' bash -s" << 'EOF'

          set -euo pipefail

          # ========================================================
          # Configuration
          # ========================================================

          HISTORY_FILE="/opt/textile/deployment-history.log"

          ECR_REGISTRY="177203142319.dkr.ecr.ap-south-1.amazonaws.com"

          AWS_REGION="ap-south-1"


          # ========================================================
          # Validate IMAGE_TAG
          # ========================================================

          if [ -z "$IMAGE_TAG" ]; then
            echo "ERROR: IMAGE_TAG is empty"
            exit 1
          fi


          # ========================================================
          # Move to application directory
          # ========================================================

          cd /opt/textile


          # ========================================================
          # Validate deployment history
          # ========================================================

          if [ ! -f "$HISTORY_FILE" ]; then
            echo "ERROR: Deployment history file not found:"
            echo "$HISTORY_FILE"
            exit 1
          fi


          # ========================================================
          # Find previous successful deployment
          # ========================================================

          ROLLBACK_SHA=$(grep '|SUCCESS$' "$HISTORY_FILE" \
            | tail -n 1 \
            | cut -d'|' -f2)


          if [ -z "$ROLLBACK_SHA" ]; then
            echo "ERROR: No previous successful deployment found"
            exit 1
          fi


          # Prevent accidentally rolling back to the same version.
          if [ "$ROLLBACK_SHA" = "$IMAGE_TAG" ]; then
            echo "ERROR: Rollback SHA is same as deployment SHA"
            exit 1
          fi


          # ========================================================
          # Display deployment information
          # ========================================================

          echo "======================================"
          echo "Starting Textile deployment"
          echo "Deployment SHA: $IMAGE_TAG"
          echo "Rollback SHA: $ROLLBACK_SHA"
          echo "======================================"


          # ========================================================
          # Record deployment STARTED
          # ========================================================

          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)|$IMAGE_TAG|STARTED" \
            >> "$HISTORY_FILE"


          # ========================================================
          # Login to Amazon ECR
          # ========================================================

          echo "Logging into Amazon ECR..."

          aws ecr get-login-password \
            --region "$AWS_REGION" | \
          docker login \
            --username AWS \
            --password-stdin "$ECR_REGISTRY"


          # ========================================================
          # Pull NEW deployment images
          # ========================================================

          echo "Pulling Docker images for SHA: $IMAGE_TAG"

          IMAGE_TAG="$IMAGE_TAG" docker compose pull


          # ========================================================
          # Deploy NEW version
          # ========================================================

          echo "Recreating application containers..."

          IMAGE_TAG="$IMAGE_TAG" docker compose up -d --force-recreate


          # ========================================================
          # Restart Nginx
          # ========================================================

          echo "Restarting Nginx to refresh upstreams..."

          docker restart textile-nginx


          # ========================================================
          # Show container status
          # ========================================================

          echo "Checking container status..."

          IMAGE_TAG="$IMAGE_TAG" docker compose ps


          # ========================================================
          # FRONTEND HEALTH CHECK
          # ========================================================

          echo "======================================"
          echo "Running application health checks"
          echo "Deployment SHA: $IMAGE_TAG"
          echo "======================================"

          echo "Checking frontend..."

          attempt=1
          max_attempts=6

          frontend_healthy=false

          while [ "$attempt" -le "$max_attempts" ]; do

            if curl -fsS http://localhost/ > /dev/null; then

              echo "Frontend health check: PASS"

              frontend_healthy=true

              break

            fi

            if [ "$attempt" -eq "$max_attempts" ]; then

              echo "Frontend health check: FAILED"

              frontend_healthy=false

              break

            fi

            echo "Frontend not ready. Retrying in 5 seconds..."

            sleep 5

            attempt=$((attempt + 1))

          done


          # ========================================================
          # BACKEND HEALTH CHECK
          # ========================================================

          if [ "$frontend_healthy" = true ]; then

            echo "Checking backend..."

            attempt=1

            backend_healthy=false

            while [ "$attempt" -le "$max_attempts" ]; do

              if curl -fsS http://localhost/api/health > /dev/null; then

                echo "Backend health check: PASS"

                backend_healthy=true

                break

              fi

              if [ "$attempt" -eq "$max_attempts" ]; then

                echo "Backend health check: FAILED"

                backend_healthy=false

                break

              fi

              echo "Backend not ready. Retrying in 5 seconds..."

              sleep 5

              attempt=$((attempt + 1))

            done

          else

            backend_healthy=false

          fi


          # ========================================================
          # SUCCESS PATH
          # ========================================================

          if [ "$frontend_healthy" = true ] \
             && [ "$backend_healthy" = true ]; then

            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)|$IMAGE_TAG|SUCCESS" \
              >> "$HISTORY_FILE"

            echo "======================================"
            echo "All health checks passed"
            echo "Deployment successful"
            echo "SHA: $IMAGE_TAG"
            echo "======================================"

            exit 0

          fi


          # ========================================================
          # DEPLOYMENT FAILURE
          # ========================================================

          echo "======================================"
          echo "DEPLOYMENT FAILED"
          echo "Failed SHA: $IMAGE_TAG"
          echo "Rollback SHA: $ROLLBACK_SHA"
          echo "======================================"


          # Record failed deployment.

          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)|$IMAGE_TAG|FAILED" \
            >> "$HISTORY_FILE"


          # ========================================================
          # START AUTOMATIC ROLLBACK
          # ========================================================

          echo "======================================"
          echo "Starting automatic rollback"
          echo "Rollback SHA: $ROLLBACK_SHA"
          echo "======================================"


          # ========================================================
          # Pull rollback images
          # ========================================================

          echo "Pulling rollback images..."

          if ! IMAGE_TAG="$ROLLBACK_SHA" docker compose pull; then

            echo "ERROR: Failed to pull rollback images"

            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)|$ROLLBACK_SHA|ROLLBACK_FAILED" \
              >> "$HISTORY_FILE"

            exit 1

          fi


          # ========================================================
          # Deploy rollback version
          # ========================================================

          echo "Recreating containers with rollback SHA..."

          if ! IMAGE_TAG="$ROLLBACK_SHA" docker compose up -d --force-recreate; then

            echo "ERROR: Failed to start rollback containers"

            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)|$ROLLBACK_SHA|ROLLBACK_FAILED" \
              >> "$HISTORY_FILE"

            exit 1

          fi


          # ========================================================
          # Restart Nginx after rollback
          # ========================================================

          echo "Restarting Nginx after rollback..."

          if ! docker restart textile-nginx; then

            echo "ERROR: Failed to restart Nginx during rollback"

            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)|$ROLLBACK_SHA|ROLLBACK_FAILED" \
              >> "$HISTORY_FILE"

            exit 1

          fi


          # ========================================================
          # Show rollback container status
          # ========================================================

          echo "Checking rollback container status..."

          IMAGE_TAG="$ROLLBACK_SHA" docker compose ps


          # ========================================================
          # ROLLBACK FRONTEND HEALTH CHECK
          # ========================================================

          echo "======================================"
          echo "Checking rollback health"
          echo "Rollback SHA: $ROLLBACK_SHA"
          echo "======================================"

          echo "Checking rollback frontend..."

          attempt=1
          max_attempts=6

          rollback_frontend_healthy=false

          while [ "$attempt" -le "$max_attempts" ]; do

            if curl -fsS http://localhost/ > /dev/null; then

              echo "Rollback frontend health check: PASS"

              rollback_frontend_healthy=true

              break

            fi

            if [ "$attempt" -eq "$max_attempts" ]; then

              echo "Rollback frontend health check: FAILED"

              rollback_frontend_healthy=false

              break

            fi

            echo "Rollback frontend not ready. Retrying in 5 seconds..."

            sleep 5

            attempt=$((attempt + 1))

          done


          # ========================================================
          # ROLLBACK BACKEND HEALTH CHECK
          # ========================================================

          if [ "$rollback_frontend_healthy" = true ]; then

            echo "Checking rollback backend..."

            attempt=1

            rollback_backend_healthy=false

            while [ "$attempt" -le "$max_attempts" ]; do

              if curl -fsS http://localhost/api/health > /dev/null; then

                echo "Rollback backend health check: PASS"

                rollback_backend_healthy=true

                break

              fi

              if [ "$attempt" -eq "$max_attempts" ]; then

                echo "Rollback backend health check: FAILED"

                rollback_backend_healthy=false

                break

              fi

              echo "Rollback backend not ready. Retrying in 5 seconds..."

              sleep 5

              attempt=$((attempt + 1))

            done

          else

            rollback_backend_healthy=false

          fi


          # ========================================================
          # ROLLBACK SUCCESS
          # ========================================================

          if [ "$rollback_frontend_healthy" = true ] \
             && [ "$rollback_backend_healthy" = true ]; then

            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)|$ROLLBACK_SHA|ROLLBACK_SUCCESS" \
              >> "$HISTORY_FILE"

            echo "======================================"
            echo "ROLLBACK SUCCESSFUL"
            echo "Restored SHA: $ROLLBACK_SHA"
            echo "======================================"

            # IMPORTANT:
            # The original deployment failed, so the GitHub Actions
            # deployment must remain FAILED even though rollback worked.

            exit 1

          fi


          # ========================================================
          # ROLLBACK FAILURE
          # ========================================================

          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)|$ROLLBACK_SHA|ROLLBACK_FAILED" \
            >> "$HISTORY_FILE"

          echo "======================================"
          echo "CRITICAL: ROLLBACK FAILED"
          echo "Rollback SHA: $ROLLBACK_SHA"
          echo "Production may be unhealthy"
          echo "======================================"

          exit 1

          EOF