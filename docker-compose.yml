services:
  backend:
    image: 177203142319.dkr.ecr.ap-south-1.amazonaws.com/textile-backend:${IMAGE_TAG}
    container_name: textile-backend
    expose:
      - "5000"
    env_file:
      - .env
    restart: always

  frontend:
    image: 177203142319.dkr.ecr.ap-south-1.amazonaws.com/textile-frontend:${IMAGE_TAG}
    container_name: textile-frontend
    expose:          # ✅ expose, NOT ports
      - "80"
    restart: always

  nginx:
    image: nginx:alpine
    container_name: textile-nginx
    ports:
      - "80:80"      # ✅ Only nginx publishes to the outside
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always