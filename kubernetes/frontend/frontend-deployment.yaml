apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: textile-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: sudeep102000/textile-frontend:v3

          ports:
            - containerPort: 80